[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "austruct"
version = "0.1.0"
description = "Structural engineering toolkit for AS 3600, AS 5100.5 and AS 5100.2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Andrew Morrison" }]

# ---------------------------------------------------------------------------
# Runtime dependencies are deliberately minimal.
#
# Rationale (roadmap Phase 4): the distribution path is a local wheelhouse on a
# shared drive and, for factory users, a compiled .exe. Every dependency added
# here is a dependency someone has to vendor into the wheelhouse and freeze into
# the .exe. numpy is the only one that earns its place -- the stiffness solver
# needs dense linear algebra.
#
# Explicitly NOT dependencies of the core package:
#   matplotlib  -- plotting is an optional extra, not needed to get a number
#   handcalcs   -- a renderer, not the report standard (roadmap Phase 2)
#   pint / forallpeople -- units are a documented convention here, see core/units.py
# ---------------------------------------------------------------------------
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
report = ["jinja2>=3.1"]
tools = [
    # The `austruct.tools` package -- bolt-on tools (retaining walls, headwalls,
    # ...) whose INPUT layer wants construction-time validation with clear
    # bounds on engineering judgement calls (backslope, water table, passive
    # neglect depth). Deliberately NOT a dependency of `austruct` core: the
    # analysis/design layers keep the dependency-minimal, no-Pydantic
    # convention in core/units.py, because their guardrail is Envelope, not a
    # model schema, and the wheelhouse/.exe distribution path in the note above
    # still applies to core. Pydantic here is scoped to `tools/` call sites only.
    "pydantic>=2.0",
    "pyyaml>=6.0",
]
optimise = [
    # `austruct.study.optimise` -- a continuous scipy.optimize search over
    # design variables (thicknesses, lengths, cover), layered on the SAME
    # build/check shape austruct.study.sweep uses. Optional for the same
    # reason `tools` is: it is a search/orchestration convenience, not part
    # of the core mechanics, and only an install actually doing continuous
    # optimisation needs it. Importing austruct.study.optimise without this
    # extra works; calling minimize_scheme() raises with this install
    # instruction.
    "scipy>=1.10",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pyyaml>=6.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
austruct = ["**/*.json", "**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: benchmark case verified against an external source (roadmap Phase 3)",
    "unverified: exercises a constant not yet checked against the printed standard",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

# ---------------------------------------------------------------------------
# Naming rules are disabled where they conflict with engineering notation.
#
# This is a deliberate, documented exception rather than laziness. Code that
# implements a printed standard should READ like the printed standard: the
# overall depth is D, the flexural rigidity is EI, the tensile steel area is
# A_st, the capacity is M_uo. Renaming those to `d_overall`, `ei`, `ast` and
# `muo` to satisfy PEP 8 would make every clause harder to check against the
# book -- which is the one thing this package most needs to stay easy.
#
# The convention is: engineering symbols keep the case used in the standard;
# everything else follows PEP 8 normally.
# ---------------------------------------------------------------------------
ignore = [
    "E501",  # line length -- clause-reference comments are allowed to run long
    "N802",  # method names: D(), I_gross(), Z_top(), C40()
    "N803",  # argument names: D, Df, EI, M_star, Ast
    "N806",  # local variables: K, F, Vuc, Muo, dv
    "N812",  # `from . import constants as C` -- intentional and readable
    "N816",  # module-level unit constants: mm, kN, kNm, MPa
    "N818",  # OutsideEnvelope / UnverifiedConstant read better without "Error"
    "B905",  # zip() strict= -- several zips deliberately pair unequal sequences
]

[tool.ruff.lint.per-file-ignores]
# Notebooks import where the reader needs the import, not all at the top. That
# is the point of a teaching notebook -- `import pandas as pd` belongs in the
# cell that first builds a DataFrame, so the reader sees why it is there.
# Unused imports (F401) are still flagged, because an import a notebook never
# uses tells the reader something is needed when it is not.
"notebooks/*.ipynb" = ["I001", "E402"]
# The tutorial job files are teaching artifacts. Their import block is grouped
# deliberately -- installed library above, the engineer's own sibling module
# below the blank line -- because that grouping is the lesson. isort would move
# `import job_data` to the top of the block and destroy it.
"tutorials/*/job/*.py" = ["I001"]
